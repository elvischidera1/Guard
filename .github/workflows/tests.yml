name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gradle:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Lint
        run: ./gradlew ktLintCheck

      - name: Build the Android library
        run: ./gradlew assembleDebug

      # The SQL core, on the JVM (see harness/README.md).
      - name: SQL unit tests
        run: ./gradlew -p harness :sqlsdk:test

      - name: Public-API scenario matches the original SDK
        run: |
          ./gradlew -p harness :sqlsdk:scenario
          python3 harness/compare_transcripts.py harness/golden/baseline-scenario.json \
            harness/sqlsdk/build/scenario.json harness/golden/expected-differences.json

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: harness/sqlsdk/build/reports/tests/test/
